<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Static page, no JavaScript: only its own styles and images from the site itself -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Mesozoic Atlas</title>
    <!-- Absolute paths: this page shows up at any nonexistent address on the site -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --page: #fbf8f2;
        --ink: #2a241c;
        --muted: #6b6052;
        --accent: #a2471f;
        --button-hover: #3f352a;
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ink);
      }

      /* Dark theme: follows the system (without JavaScript, the choice made in the atlas can't be read) */
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #1d1a16;
          --ink: #ece6dc;
          --muted: #b3a998;
          --accent: #f08a55;
          --button-hover: #d6cdbf;
        }
        /* Darker rock and footprints, keeping the drawing */
        .ground { filter: brightness(0.5) saturate(1.3); }
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; background: var(--page); }

      body {
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 100dvh;
      }

      main {
        display: grid;
        place-items: center;
        padding: 48px 20px 16px;
        text-align: center;
      }

      .code {
        margin: 0;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 8px 0 12px;
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        letter-spacing: -0.02em;
        line-height: 1.15;
      }

      .text {
        max-width: 34rem;
        margin: 0 auto 28px;
        line-height: 1.55;
        color: var(--muted);
      }

      .back {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 8px;
        background: var(--ink);
        color: var(--page);
        font-weight: 600;
        text-decoration: none;
      }

      .back:hover { background: var(--button-hover); }

      .back:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }

      /* ---------- Ground: rock layers with a trail of T. rex footprints ---------- */
      .ground {
        position: relative;
        height: clamp(170px, 24vw, 270px);
        background: url("/img/strata.svg") bottom / 100% 100% no-repeat;
        overflow: hidden;
      }

      /* The image is a right foot with the toes up; rotated 90°, the animal walks to the right.
         The left foot is the same drawing mirrored. The feet alternate above/below the stride
         line, as in a real trackway. */
      .footprint {
        position: absolute;
        width: clamp(54px, 7vw, 92px);
        transform: translate(-50%, -50%) rotate(var(--turn)) scaleX(var(--side));
      }

      .right { --side: 1; top: 66%; }
      .left { --side: -1; top: 43%; }

      .footprint:nth-child(1) { left: 14%; --turn: 86deg; }
      .footprint:nth-child(2) { left: 36%; --turn: 93deg; }
      .footprint:nth-child(3) { left: 58%; --turn: 88deg; }
      .footprint:nth-child(4) { left: 80%; --turn: 94deg; }

      /* The footprints appear one after another, as if the animal were walking by */
      @media (prefers-reduced-motion: no-preference) {
        .footprint { animation: appear 600ms ease-out both; }
        .footprint:nth-child(2) { animation-delay: 350ms; }
        .footprint:nth-child(3) { animation-delay: 700ms; }
        .footprint:nth-child(4) { animation-delay: 1050ms; }
        @keyframes appear {
          from { opacity: 0; }
          to { opacity: 1; }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <p class="code">Error 404</p>
        <h1>This fossil could not be found</h1>
        <p class="text">
          The page you were looking for doesn’t exist. A <em>Tyrannosaurus rex</em> came through here,
          but only left its footprints. The atlas, with more than 22,000 fossils, is right where it was.
        </p>
        <a class="back" href="/">Back to the Mesozoic Atlas</a>
      </div>
    </main>

    <div class="ground" aria-hidden="true">
      <img class="footprint right" src="/img/trex-footprint.svg" alt="" />
      <img class="footprint left" src="/img/trex-footprint.svg" alt="" />
      <img class="footprint right" src="/img/trex-footprint.svg" alt="" />
      <img class="footprint left" src="/img/trex-footprint.svg" alt="" />
    </div>
  </body>
</html>
