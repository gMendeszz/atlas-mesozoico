<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Página estática, sem JavaScript: só estilos daqui e imagens do próprio site -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada · Atlas Mesozoico</title>
    <!-- Caminhos absolutos: esta página aparece em qualquer endereço inexistente do site -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --fundo: #fbf8f2;
        --texto: #2a241c;
        --suave: #6b6052;
        --destaque: #a2471f;
        --botao-hover: #3f352a;
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--texto);
      }

      /* Tema escuro: segue o sistema (sem JavaScript, não dá pra ler a escolha feita no atlas) */
      @media (prefers-color-scheme: dark) {
        :root {
          --fundo: #1d1a16;
          --texto: #ece6dc;
          --suave: #b3a998;
          --destaque: #f08a55;
          --botao-hover: #d6cdbf;
        }
        /* Rocha e pegadas mais escuras, mantendo o desenho */
        .chao { filter: brightness(0.5) saturate(1.3); }
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; background: var(--fundo); }

      body {
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 100dvh;
      }

      main {
        display: grid;
        place-items: center;
        padding: 48px 20px 16px;
        text-align: center;
      }

      .codigo {
        margin: 0;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--suave);
      }

      h1 {
        margin: 8px 0 12px;
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        letter-spacing: -0.02em;
        line-height: 1.15;
      }

      .texto {
        max-width: 34rem;
        margin: 0 auto 28px;
        line-height: 1.55;
        color: var(--suave);
      }

      .voltar {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 8px;
        background: var(--texto);
        color: var(--fundo);
        font-weight: 600;
        text-decoration: none;
      }

      .voltar:hover { background: var(--botao-hover); }

      .voltar:focus-visible {
        outline: 3px solid var(--destaque);
        outline-offset: 3px;
      }

      /* ---------- Chão: camadas de rocha com uma trilha de pegadas de T. rex ---------- */
      .chao {
        position: relative;
        height: clamp(170px, 24vw, 270px);
        background: url("/img/estratos.svg") bottom / 100% 100% no-repeat;
        overflow: hidden;
      }

      /* A imagem é um pé direito com os dedos pra cima; girada 90°, o animal anda pra direita.
         O pé esquerdo é o mesmo desenho espelhado. Os pés alternam acima/abaixo da linha do
         passo, como numa trilha real. */
      .pegada {
        position: absolute;
        width: clamp(54px, 7vw, 92px);
        transform: translate(-50%, -50%) rotate(var(--giro)) scaleX(var(--lado));
      }

      .direita { --lado: 1; top: 66%; }
      .esquerda { --lado: -1; top: 43%; }

      .pegada:nth-child(1) { left: 14%; --giro: 86deg; }
      .pegada:nth-child(2) { left: 36%; --giro: 93deg; }
      .pegada:nth-child(3) { left: 58%; --giro: 88deg; }
      .pegada:nth-child(4) { left: 80%; --giro: 94deg; }

      /* As pegadas aparecem uma depois da outra, como se o animal estivesse passando */
      @media (prefers-reduced-motion: no-preference) {
        .pegada { animation: surgir 600ms ease-out both; }
        .pegada:nth-child(2) { animation-delay: 350ms; }
        .pegada:nth-child(3) { animation-delay: 700ms; }
        .pegada:nth-child(4) { animation-delay: 1050ms; }
        @keyframes surgir {
          from { opacity: 0; }
          to { opacity: 1; }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <p class="codigo">Erro 404</p>
        <h1>Este fóssil não foi encontrado</h1>
        <p class="texto">
          A página que você procurou não existe. Um <em>Tyrannosaurus rex</em> passou por aqui,
          mas só deixou as pegadas. O atlas, com os mais de 22 mil fósseis, continua no mesmo lugar.
        </p>
        <a class="voltar" href="/">Voltar ao Atlas Mesozoico</a>
      </div>
    </main>

    <div class="chao" aria-hidden="true">
      <img class="pegada direita" src="/img/pegada-rex.svg" alt="" />
      <img class="pegada esquerda" src="/img/pegada-rex.svg" alt="" />
      <img class="pegada direita" src="/img/pegada-rex.svg" alt="" />
      <img class="pegada esquerda" src="/img/pegada-rex.svg" alt="" />
    </div>
  </body>
</html>
