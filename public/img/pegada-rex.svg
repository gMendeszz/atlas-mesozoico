<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 116 116">
  <!--
    Pegada de Tyrannosaurus rex (pé direito, dedos pra cima), afundada na rocha.

    Forma baseada nas pegadas de tiranossaurídeos (icnogênero Tyrannosauripus): três dedos
    grossos abertos em leque, o do meio (III) mais longo, calcanhar largo que se funde direto
    nos dedos (sem o "pescoço" fino das pegadas de aves), almofadas marcadas e garras curtas.

    A luz vem da direção dos dedos: assim o pé esquerdo (este desenho espelhado, no CSS da
    página) fica iluminado do mesmo jeito que o direito.

    Camadas, de baixo pra cima:
      1. borda de sedimento empurrado pra fora pelo pé
      2. a marca (fundo mais escuro no centro, onde afundou mais)
      3. almofadas dos dedos e do calcanhar (marcas mais fundas)
      4. sombra na parede de cima e brilho na parede de baixo (dá a profundidade)
      5. garras
  -->
  <defs>
    <!-- Contorno: calcanhar → dedo II (esquerda) → dedo III (meio) → dedo IV (direita) -->
    <path id="contorno" d="
      M50 98
      C38 98 30 92 27 82
      C25 74 22 64 17 54
      C12 45 8 36 9 28
      C10 22 15 19 20 21
      C24 23 27 29 30 35
      C33 41 37 46 41 49
      C40 38 40 22 43 12
      C45 6 48 4 50 3
      C52 4 55 6 57 12
      C60 22 60 38 59 49
      C63 46 67 41 70 35
      C73 29 76 23 80 21
      C85 19 90 22 91 28
      C92 36 88 45 83 54
      C78 64 75 74 73 82
      C70 92 62 98 50 98 Z" />

    <clipPath id="dentro-da-marca">
      <use href="#contorno" />
    </clipPath>

    <filter id="suave" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" />
    </filter>
    <filter id="bem-suave" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <radialGradient id="fundo" cx="50%" cy="60%" r="62%">
      <stop offset="0" stop-color="#7d6a4c" />
      <stop offset="0.7" stop-color="#94805e" />
      <stop offset="1" stop-color="#a8936f" />
    </radialGradient>
  </defs>

  <!-- 1. Borda de sedimento empurrado pra fora -->
  <use href="#contorno" fill="none" stroke="#ece2cc" stroke-width="8" stroke-linejoin="round" opacity="0.7" filter="url(#bem-suave)" />

  <!-- 2. A marca -->
  <use href="#contorno" fill="url(#fundo)" />

  <g clip-path="url(#dentro-da-marca)">
    <!-- 3. Almofadas: onde o pé apertou mais (3 por dedo + calcanhar) -->
    <g fill="#5d4c34" opacity="0.42" filter="url(#suave)">
      <ellipse cx="50" cy="78" rx="15" ry="11" />
      <!-- dedo III -->
      <ellipse cx="50" cy="40" rx="6" ry="6.5" />
      <ellipse cx="50" cy="27" rx="5.2" ry="5.5" />
      <ellipse cx="50" cy="15" rx="4" ry="4.6" />
      <!-- dedo II (inclinado) -->
      <ellipse cx="30" cy="45" rx="6" ry="6.5" transform="rotate(-33 30 45)" />
      <ellipse cx="23" cy="35" rx="5.2" ry="5.5" transform="rotate(-33 23 35)" />
      <ellipse cx="17" cy="26" rx="4" ry="4.6" transform="rotate(-33 17 26)" />
      <!-- dedo IV (inclinado) -->
      <ellipse cx="70" cy="45" rx="6" ry="6.5" transform="rotate(33 70 45)" />
      <ellipse cx="77" cy="35" rx="5.2" ry="5.5" transform="rotate(33 77 35)" />
      <ellipse cx="83" cy="26" rx="4" ry="4.6" transform="rotate(33 83 26)" />
    </g>

    <!-- 4. Profundidade: a parede de cima fica na sombra, a de baixo pega luz -->
    <use href="#contorno" fill="none" stroke="#3e3223" stroke-width="7" opacity="0.6" transform="translate(0 3)" filter="url(#suave)" />
    <use href="#contorno" fill="none" stroke="#f1e7d2" stroke-width="5" opacity="0.55" transform="translate(0 -2.5)" filter="url(#suave)" />
  </g>

  <!-- 5. Garras: curtas, saindo de dentro da ponta de cada dedo -->
  <g fill="#5a4a33" opacity="0.7">
    <path d="M47 10 Q50 0.5 53 10 Q50 8 47 10 Z" />
    <path d="M13 26 Q9.5 18 17.5 20.5 Q14.5 22.5 13 26 Z" />
    <path d="M87 26 Q90.5 18 82.5 20.5 Q85.5 22.5 87 26 Z" />
  </g>
</svg>
